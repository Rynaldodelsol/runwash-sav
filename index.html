<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RunWash · SAV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFD53A;
    --bg-dark: #F5C420;
    --ink: #1A1A2E;
    --ink-soft: #4A4A6A;
    --accent: #1F5DFF;
    --accent-dark: #0A2A8C;
    --accent-soft: rgba(31,93,255,0.12);
    --cream: #FFF8E0;
    --bad: #FF4D3D;
    --font-display: "Bowlby One SC", "Arial Black", sans-serif;
    --font-body: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 20% 80%, rgba(31,93,255,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,77,61,0.06) 0%, transparent 50%),
      radial-gradient(circle, rgba(0,0,0,0.05) 1.5px, transparent 1.5px);
    background-size: 100% 100%, 100% 100%, 28px 28px;
    overflow-x: hidden;
  }

  /* ── Bulles flottantes ── */
  .bubble {
    position: fixed; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none; z-index: 1;
    animation: floatUp linear infinite;
  }
  .bubble.b1 { width:70px;  height:70px;  left:4%;  top:75%; animation-duration:22s; }
  .bubble.b2 { width:45px;  height:45px;  left:88%; top:25%; animation-duration:28s; animation-delay:-5s; }
  .bubble.b3 { width:100px; height:100px; left:73%; top:82%; animation-duration:35s; animation-delay:-12s; }
  .bubble.b4 { width:30px;  height:30px;  left:52%; top:88%; animation-duration:18s; animation-delay:-8s; }
  .bubble.b5 { width:58px;  height:58px;  left:14%; top:12%; animation-duration:30s; animation-delay:-3s; }
  .bubble.b6 { width:38px;  height:38px;  left:35%; top:92%; animation-duration:25s; animation-delay:-15s; }
  @keyframes floatUp {
    0%   { transform:translate(0,0) scale(1);    opacity:0.5; }
    50%  { transform:translate(15px,-140px) scale(1.08); opacity:0.75; }
    100% { transform:translate(-8px,-280px) scale(0.85); opacity:0; }
  }
  @media (max-width:600px){ .bubble{ display:none; } }

  /* Progress bar */
  #progress-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 6px;
    background: rgba(0,0,0,0.08); z-index: 50;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, #4A8AFF 100%);
    width: 0%; transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 8px rgba(31,93,255,0.5);
  }

  /* Header */
  #header {
    position: fixed; top: 12px; right: 12px;
    display: flex; align-items: center; gap: 8px; z-index: 100;
  }
  #step-counter {
    background: var(--ink); color: var(--bg);
    padding: 5px 12px; border-radius: 999px;
    font-family: var(--font-display);
    font-size: 12px; letter-spacing: 0.5px;
  }
  #back-btn {
    background: white;
    border: 2.5px solid var(--ink);
    border-radius: 999px; padding: 5px 12px;
    color: var(--ink); font-family: var(--font-body);
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 3px 0 0 var(--ink);
  }
  #back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 0 var(--ink); }
  #back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--ink); }
  #back-btn.hidden { display: none; }

  /* Layout */
  #app {
    position: relative; z-index: 5;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 80px 5% 60px 8%;
  }
  #screen {
    width: 100%;
    max-width: 620px;
    animation: slideIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Question number badge */
  .qnum {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: white;
    width: 36px; height: 36px; border-radius: 50%;
    font-family: var(--font-display); font-size: 15px;
    margin-right: 12px;
    box-shadow: 0 4px 0 0 var(--accent-dark);
    transform: rotate(-4deg);
    vertical-align: middle; flex-shrink: 0;
  }

  /* Question label */
  .qlabel {
    font-family: var(--font-body);
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.3; color: var(--ink);
    margin: 0; font-weight: 600;
    letter-spacing: -0.02em; display: inline;
    vertical-align: middle;
  }
  .qlabel b {
    background: linear-gradient(180deg, transparent 60%, rgba(31,93,255,0.25) 60%);
    padding: 0 3px; font-weight: 800;
  }
  .req { color: var(--bad); margin-left: 2px; }

  .title-big {
    font-family: var(--font-display);
    font-size: clamp(24px, 5vw, 44px);
    line-height: 1.1; margin: 0; color: var(--ink);
  }
  .title-big .accent { color: var(--accent); }

  .question-block { margin-bottom: 24px; }
  .hint {
    font-size: 15px; color: var(--ink-soft);
    margin-top: 10px; font-weight: 500; line-height: 1.4;
  }
  .hint-tag {
    display: inline-block;
    background: var(--cream);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    color: var(--ink); margin-top: 14px;
    box-shadow: 0 3px 0 0 var(--ink);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Inputs */
  .text-input, select, textarea {
    width: 100%; max-width: 520px;
    background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 12px;
    font-family: var(--font-body); font-size: 20px;
    font-weight: 600; color: var(--ink);
    padding: 13px 16px; outline: none; margin-top: 16px;
    transition: all 0.15s;
    box-shadow: 0 4px 0 0 var(--ink);
    -webkit-appearance: none;
  }
  .text-input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 4px 0 0 var(--accent-dark);
    transform: translateY(-1px);
  }
  textarea { resize: none; min-height: 110px; line-height: 1.4; font-size: 18px; }
  .text-input::placeholder, textarea::placeholder {
    color: rgba(74,74,106,0.4); font-weight: 500;
  }
  select { cursor: pointer; }
  select option { font-size: 16px; }

  /* Phone input */
  .phone-wrap { display: flex; align-items: stretch; gap: 10px; margin-top: 16px; max-width: 520px; }
  .phone-prefix {
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 0 16px; font-family: var(--font-display); font-size: 14px;
    color: var(--ink); box-shadow: 0 4px 0 0 var(--ink);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; flex-shrink: 0;
  }
  .phone-input { flex: 1; margin-top: 0 !important; min-width: 0; }
  .phone-format {
    font-size: 13px; color: var(--ink-soft); margin-top: 8px;
    font-weight: 500; font-style: italic;
  }

  /* Choice buttons */
  .choice {
    display: flex; align-items: center;
    width: 100%; max-width: 520px;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 10px; cursor: pointer;
    font-family: var(--font-body); font-size: 18px; font-weight: 600;
    color: var(--ink); text-align: left;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    outline: none; box-shadow: 0 4px 0 0 var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .choice:hover {
    transform: translateY(-2px) translateX(2px);
    background: white; box-shadow: 0 6px 0 0 var(--ink);
  }
  .choice:active { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--ink); }
  .choice.selected {
    background: var(--accent); color: white;
    border-color: var(--accent-dark); box-shadow: 0 4px 0 0 var(--accent-dark);
  }
  .choice.selected .key-badge { background: white; color: var(--accent); border-color: white; }
  .key-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px;
    border: 2.5px solid var(--ink); background: var(--bg);
    color: var(--ink); font-family: var(--font-display); font-size: 13px;
    margin-right: 12px; flex-shrink: 0; transition: all 0.15s;
  }

  /* Buttons */
  .btn-row { display: flex; align-items: center; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--accent); color: white;
    border: 2.5px solid var(--accent-dark); border-radius: 14px;
    padding: 13px 26px; font-family: var(--font-display); font-size: 17px;
    cursor: pointer; box-shadow: 0 5px 0 0 var(--accent-dark);
    transition: all 0.12s; letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 0 var(--accent-dark); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 0 var(--accent-dark); }
  .btn-primary:disabled {
    background: #B5B5C5; border-color: #7A7A8A;
    cursor: not-allowed; box-shadow: 0 4px 0 0 #7A7A8A; transform: none;
  }
  .btn-hint { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .btn-hint kbd {
    display: inline-block; background: white; border: 1.5px solid var(--ink);
    border-radius: 5px; padding: 1px 7px; font-family: var(--font-body);
    font-weight: 700; font-size: 12px; box-shadow: 0 2px 0 0 var(--ink); margin: 0 2px;
  }

  /* Logo */
  .logo-runwash {
    display: block; width: clamp(160px, 35vw, 260px); height: auto;
    margin: 0 0 28px 0;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15));
    transform: rotate(-2deg);
    animation: logoBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes logoBounce {
    0%   { opacity: 0; transform: rotate(-2deg) translateY(-30px) scale(0.9); }
    100% { opacity: 1; transform: rotate(-2deg) translateY(0) scale(1); }
  }

  /* Welcome layout avec Washou */
  .welcome-layout {
    display: flex; align-items: center; gap: 20px;
    width: 100%; max-width: 860px;
    min-height: calc(100vh - 140px);
  }
  .welcome-content { flex: 1; min-width: 0; }
  .washou-wrap {
    flex-shrink: 0;
    width: clamp(160px, 26vw, 280px);
    display: flex; align-items: flex-end; justify-content: center;
    align-self: flex-end;
  }
  .washou-img {
    width: 100%; height: auto;
    max-height: 90vh;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,0.35)) saturate(1.05);
    animation: washouIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
  }
  @keyframes washouIn {
    0%   { opacity:0; transform:translateY(40px) scale(0.85); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @media (max-width:700px){
    .welcome-layout {
      flex-direction: row; align-items: flex-end; gap: 10px;
      min-height: auto; padding-bottom: 0;
    }
    .welcome-content { flex: 1; min-width: 0; }
    .washou-wrap {
      width: clamp(160px, 42vw, 230px);
      flex-shrink: 0;
      align-self: flex-end;
      margin-right: -10px;
    }
    .washou-img { max-height: 65vh; width: 100%; }
  }

  /* Alert */
  .alert-blocked {
    margin-top: 20px; background: #FFE5E0;
    border: 2.5px solid var(--bad); border-radius: 14px;
    padding: 16px 18px; max-width: 520px;
    box-shadow: 0 5px 0 0 #B33020;
  }
  .alert-blocked strong {
    color: var(--bad); font-family: var(--font-display); font-size: 16px;
    display: block; margin-bottom: 6px;
  }

  /* Thanks */
  #screen.thanks-screen { text-align: center; max-width: 560px; margin: 0 auto; }
  .thanks-emoji {
    font-size: 72px; line-height: 1;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block;
  }
  @keyframes pop {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .thanks-title {
    font-family: var(--font-display);
    font-size: clamp(36px, 8vw, 52px);
    margin: 12px 0 16px 0; color: var(--ink);
  }
  .thanks-card {
    background: white; border: 2.5px solid var(--ink);
    border-radius: 18px; padding: 20px 24px; margin-top: 24px;
    text-align: left; box-shadow: 0 6px 0 0 var(--ink);
  }
  .thanks-card .card-title {
    font-family: var(--font-display); font-size: 16px; margin: 0 0 12px 0; color: var(--accent);
  }
  .thanks-card ul { line-height: 1.7; padding-left: 0; list-style: none; margin: 0; }
  .thanks-card li {
    padding: 7px 0; font-size: 15px; font-weight: 500;
    border-bottom: 1.5px dashed rgba(0,0,0,0.1);
  }
  .thanks-card li:last-child { border-bottom: none; }
  .thanks-card li::before { content: "▸"; color: var(--accent); font-weight: 800; margin-right: 8px; }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 600px) {
    #app { padding: 70px 20px 40px 20px; align-items: flex-start; padding-top: 80px; }
    #screen { max-width: 100%; }
    .text-input, select, textarea, .choice { max-width: 100%; font-size: 17px; }
    .choice { font-size: 16px; padding: 12px 14px; }
    .phone-wrap { max-width: 100%; }
    .phone-prefix { font-size: 13px; padding: 0 12px; }
    .btn-hint { display: none; }
    .hint-tag { font-size: 12px; }
    select option { font-size: 16px; }
  }
  @media (max-width: 380px) {
    .qlabel { font-size: 20px; }
    .title-big { font-size: 26px; }
    .qnum { width: 30px; height: 30px; font-size: 13px; margin-right: 8px; }
  }

  /* Washou : caché sur mobile, visible desktop */
  @media (max-width:700px) {
    .washou-wrap { display: none !important; }
    .welcome-layout {
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
    }
    .welcome-content {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      width: 100% !important;
    }
    .btn-row { justify-content: center !important; }
    .btn-primary { min-width: 260px; }
  }

  /* Bouton calendrier */
  .date-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 520px;
    background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 12px;
    font-family: var(--font-body); font-size: 20px; font-weight: 600;
    color: var(--ink); padding: 14px 18px; margin-top: 16px;
    cursor: pointer; text-align: left;
    box-shadow: 0 4px 0 0 var(--ink);
    transition: all 0.15s;
  }
  .date-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 0 var(--ink); }
  .date-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--ink); }
  .date-btn.selected { border-color: var(--accent); box-shadow: 0 4px 0 0 var(--accent-dark); color: var(--accent); }
  .date-btn .cal-icon { font-size: 26px; flex-shrink: 0; }
  .date-btn .cal-text { flex: 1; }
  .date-btn .cal-placeholder { color: rgba(74,74,106,0.4); font-weight: 500; }

  .date-btn-wrap {
    position: relative;
    max-width: 520px;
    margin-top: 16px;
  }
  .date-inp-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    font-size: 16px; /* évite le zoom auto sur iOS */
  }

  /* Date input natif stylisé */
  input[type="date"].text-input {
    -webkit-appearance: none;
    appearance: none;
    color: var(--accent);
    cursor: pointer;
  }
  input[type="date"].text-input::-webkit-calendar-picker-indicator {
    cursor: pointer;
    font-size: 22px;
    filter: invert(25%) sepia(90%) saturate(2000%) hue-rotate(216deg);
    margin-left: 8px;
  }
  input[type="date"].text-input::-webkit-inner-spin-button { display: none; }
  input[type="date"].text-input::-webkit-datetime-edit-fields-wrapper { color: var(--accent); }
  input[type="date"].text-input::-webkit-datetime-edit-text { color: var(--ink-soft); }
</style>
</head>

  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="header">
    <button id="back-btn" class="hidden">← Retour</button>
    <span id="step-counter">1 / 15</span>
  </div>
  <div id="app"><div id="screen"></div></div>

  { key: "A", label: "Sainte-Clotilde" },
  { key: "B", label: "Sainte-Marie" },
  { key: "C", label: "Saint-Benoît" },
  { key: "D", label: "Saint-Louis" },
  { key: "E", label: "Saint-Pierre" },
];

  "Haute Pression 1", "Haute Pression 2", "Haute Pression 3", "Haute Pression 4",
  "Aspirateur 1", "Aspirateur 2", "Aspirateur 3", "Aspirateur 4",

const INCIDENTS = [
  { key: "A", label: "Jeton avalé sans démarrage" },
  { key: "B", label: "Programme non lancé après paiement" },
  { key: "C", label: "Arrêt brutal en cours de lavage" },
  { key: "D", label: "CB débitée sans service" },
  { key: "E", label: "Autre (je précise après)" },
];

const TIME_SLOTS = (() => {
  const out = [];
  for (let h = 6; h <= 22; h++) {
    out.push(`${String(h).padStart(2,"0")}h00 - ${String(h).padStart(2,"0")}h30`);
    out.push(`${String(h).padStart(2,"0")}h30 - ${String(h+1).padStart(2,"0")}h00`);
  }
  return out;
})();

// Steps : suppression de la Q1 (bloqué), on garde 14 étapes + thanks
const STEPS = [
  "welcome","center","machine","incident_type",
  "date","time_slot","description","brand","color","plate",
  "firstname","lastname","phone","consent","thanks"
];

const data = {
  center:"", machine:"", incidentType:"",
  date:"", timeSlot:"", description:"",
  brand:"", color:"", plate:"",
  firstname:"", lastname:"", phone:"",
  consent: null
};
let step = 0;
let submitting = false;

const $ = id => document.getElementById(id);
const screen = () => $("screen");
function update(k,v){ data[k]=v; }
function next(){ if(step < STEPS.length-1){ step++; render(); } }
function prev(){ if(step > 0){ step--; render(); } }

function updateChrome(){
  const pct = ((step+1)/STEPS.length)*100;
  $("progress-fill").style.width = pct+"%";
  $("step-counter").textContent = (step+1)+" / "+STEPS.length;
  const back = $("back-btn");
  if(step===0||step===STEPS.length-1) back.classList.add("hidden");
  else back.classList.remove("hidden");
}

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function enterHint(){ return `<span class="btn-hint">appuyez sur <kbd>Entrée</kbd> ↵</span>`; }

// ============================================================
// SCREENS
// ============================================================

function renderWelcome(){
  screen().style.maxWidth = "860px";
  screen().innerHTML = `
    <div class="welcome-layout">
      <div class="welcome-content">
        <img class="logo-runwash" src="${_LOGO}" alt="RunWash" />
        <h1 class="title-big">
          Bonjour <span class="accent">&#x1F44B;</span><br>
          Un souci sur<br>une de nos machines ?
        </h1>
        <p class="hint" style="font-size:18px;margin-top:18px;max-width:440px;">
          Pas de panique. Nous allons vous rembourser, nous avons juste besoin de comprendre ce qui s'est passé pour vérifier sur les caméras.
        </p>
        <span class="hint-tag">&#x23F1; 2 minutes &middot; Réponse sous 48h &middot; Jeton en centre</span>
        <div class="btn-row">
          <button class="btn-primary" id="cta">Commencer &#x2192;</button>
        </div>
      </div>
      <div class="washou-wrap">
        <img class="washou-img" src="${_WASHOU}" alt="Washou" />
      </div>
    </div>`;
  $("cta").onclick = next;
}

function renderCenter(){
  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">1</span>
      <h2 class="qlabel">Dans <b>quel RunWash</b> a eu lieu l'incident ?<span class="req">*</span></h2>
    </div>
    <div id="opts">
      ${CENTERS.map(c=>`
        <button class="choice ${data.center===c.label?"selected":""}" data-v="${esc(c.label)}">
          <span class="key-badge">${c.key}</span>${esc(c.label)}
        </button>`).join("")}
    </div>`;
  document.querySelectorAll("#opts .choice").forEach(b=>{
    b.onclick = ()=>{ update("center",b.dataset.v); next(); };
  });
}

function renderMachine(){
  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">2</span>
      <h2 class="qlabel">Sur <b>quelle machine</b> avez-vous eu le problème ?<span class="req">*</span></h2>
    </div>
    <select id="inp">
      <option value="">— Choisir —</option>
      ${MACHINES.map(m=>`<option value="${esc(m)}" ${data.machine===m?"selected":""}>${esc(m)}</option>`).join("")}
    </select>
    <div class="btn-row">
      <button class="btn-primary" id="cta" ${data.machine?"":"disabled"}>OK ✓</button>
      ${enterHint()}
    </div>`;
  $("inp").onchange = e=>{ update("machine",e.target.value); $("cta").disabled=!data.machine; };
  $("cta").onclick = ()=> data.machine && next();
}

function renderIncidentType(){
  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">3</span>
      <h2 class="qlabel">Que s'est-il passé <b>exactement</b> ?<span class="req">*</span></h2>
    </div>
    <div id="opts">
      ${INCIDENTS.map(i=>`
        <button class="choice ${data.incidentType===i.label?"selected":""}" data-v="${esc(i.label)}">
          <span class="key-badge">${i.key}</span>${esc(i.label)}
        </button>`).join("")}
    </div>`;
  document.querySelectorAll("#opts .choice").forEach(b=>{
    b.onclick = ()=>{ update("incidentType",b.dataset.v); next(); };
  });
}

function renderDate(){
  const today = new Date().toISOString().split("T")[0];

  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">4</span>
      <h2 class="qlabel"><b>Quand</b> est-ce arrivé ?<span class="req">*</span></h2>
    </div>
    <input type="date" id="date-inp" class="text-input"
      max="${today}"
      value="${data.date||""}"
      style="cursor:pointer;" />
    <div class="btn-row" style="margin-top:24px;">
      <button class="btn-primary" id="date-cta" ${data.date?"":"disabled"}>OK ✓</button>
      <span class="btn-hint">appuyez sur <kbd>Entrée</kbd> ↵</span>
    </div>`;

  const inp = $("date-inp");
  inp.focus();

  const onChange = ()=>{
    update("date", inp.value);
    $("date-cta").disabled = !inp.value;
    if(inp.value) setTimeout(next, 300); // avance auto
  };

  inp.onchange = onChange;
  $("date-cta").onclick = ()=> data.date && next();
  inp.onkeydown = e=>{ if(e.key==="Enter" && data.date) next(); };
}

function renderTimeSlot(){
  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">5</span>
      <h2 class="qlabel">À <b>quelle heure environ</b> ?<span class="req">*</span></h2>

function renderTextField(num, labelHtml, key, placeholder, required, validate){
  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">${num}</span>
      <h2 class="qlabel">${labelHtml}${required?'<span class="req">*</span>':""}</h2>
    </div>
    <input id="inp" class="text-input" placeholder="${esc(placeholder)}" value="${esc(data[key])}" autocomplete="off" />
    <div class="btn-row">
      <button class="btn-primary" id="cta" ${validate(data[key])?"":"disabled"}>OK ✓</button>
      ${enterHint()}
    </div>`;
  const inp = $("inp"); inp.focus();
  inp.oninput = e=>{
    let v = e.target.value;
    if(key==="plate") v = v.toUpperCase();
    update(key,v);
    if(key==="plate") inp.value = v;
    $("cta").disabled = !validate(data[key]);
  };
  $("cta").onclick = ()=> validate(data[key]) && next();
  inp.onkeydown = e=>{ if(e.key==="Enter"&&validate(data[key])) next(); };
}

function renderPlate(){
  // Validation : AA-123-BB (2 lettres, 3 chiffres, 2 lettres)
  const isValidPlate = raw => /^[A-Z]{2}-[0-9]{3}-[A-Z]{2}$/.test(raw);

  const plateRaw = () => data.plate; // stocké avec tirets ex: AB-123-CD

  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">9</span>
      <h2 class="qlabel">Votre <b>plaque d'immatriculation</b><span class="req">*</span></h2>
      <p class="hint">Obligatoire : format <b>AB-123-CD</b> — les tirets s'ajoutent automatiquement.</p>
    </div>
    <input id="inp" class="text-input" placeholder="AB-123-CD"
      value="${esc(data.plate)}"
      style="text-transform:uppercase;letter-spacing:3px;font-family:monospace;font-size:24px;"
      maxlength="9" autocomplete="off" inputmode="text" />
    <div id="plate-error" style="color:var(--bad);font-size:14px;font-weight:600;margin-top:8px;display:none;">
      Format invalide — exemple : AB-123-CD
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="cta" ${isValidPlate(data.plate)?"":"disabled"}>OK ✓</button>
      ${enterHint()}
    </div>`;

  const inp = $("inp"); inp.focus();

  inp.oninput = e => {
    // Récupérer uniquement les caractères alphanumériques saisis
    let raw = inp.value.replace(/-/g,"").toUpperCase().slice(0,7);
    let formatted = raw;

    // Insertion auto des tirets : LL-DDD-LL
    if(raw.length > 2) formatted = raw.slice(0,2) + "-" + raw.slice(2);
    if(raw.length > 5) formatted = raw.slice(0,2) + "-" + raw.slice(2,5) + "-" + raw.slice(5);

    inp.value = formatted;
    update("plate", formatted);

    const valid = isValidPlate(formatted);
    $("cta").disabled = !valid;
    $("plate-error").style.display = (formatted.length === 9 && !valid) ? "block" : "none";
  };

  $("cta").onclick = ()=> isValidPlate(data.plate) && next();
  inp.onkeydown = e=>{ if(e.key==="Enter"&&isValidPlate(data.plate)) next(); };
}

function renderFirstname(){ renderTextField(10,"Votre <b>prénom</b>","firstname","Répondez ici…",true,v=>v.length>=1); }

function renderPhone(){
  const isValidPhone = v => v.replace(/\D/g,"").length === 10;

  screen().innerHTML = `
    <div class="question-block">
      <span class="qnum">12</span>
      <h2 class="qlabel">Votre <b>numéro de téléphone</b><span class="req">*</span></h2>
      <p class="hint">10 chiffres obligatoires — nous vous appelons dès que la vidéo est vérifiée.</p>
    </div>
    <input id="inp" type="tel" class="text-input"
      placeholder="0692 56 56 56"
      value="${esc(data.phone)}"
      maxlength="14"
      inputmode="tel"
      autocomplete="tel" />
    <div id="phone-error" style="color:var(--bad);font-size:14px;font-weight:600;margin-top:8px;display:none;">
      10 chiffres requis
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="cta" ${isValidPhone(data.phone)?"":"disabled"}>OK ✓</button>
      ${enterHint()}
    </div>`;

  const inp = $("inp"); inp.focus();
  inp.oninput = e => {
    let digits = e.target.value.replace(/\D/g,"").slice(0,10);
    // Formatage XX XX XX XX XX
    const formatted = digits.replace(/(\d{2})(?=\d)/g,"$1 ").trim();
    inp.value = formatted;
    update("phone", digits);
    const valid = isValidPhone(digits);
    $("cta").disabled = !valid;
    $("phone-error").style.display = (digits.length > 0 && digits.length < 10) ? "block" : "none";
  };
  $("cta").onclick = ()=> isValidPhone(data.phone) && next();
  inp.onkeydown = e=>{ if(e.key==="Enter"&&isValidPhone(data.phone)) next(); };
}

// ============================================================
// SUBMIT
// ============================================================
async function submit(){
  if(submitting) return;
  submitting = true;
  $("status").innerHTML=`<p style="margin-top:14px;font-weight:600;">Envoi en cours…</p>`;

  const payload = {...data, submitted_at:new Date().toISOString(), source:"runwash-sav-v2"};

  if(!WEBHOOK_URL){
    console.log("PAYLOAD:", JSON.stringify(payload, null, 2));
    setTimeout(()=>{ submitting=false; next(); }, 600);
    return;
  }

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    submitting = false;
    next();
  } catch(err) {
    console.error("Erreur envoi:", err.message);
    submitting = false;
    $("status").innerHTML = `<p style="color:var(--bad);margin-top:14px;font-weight:600;">
      Impossible d'envoyer. Vérifiez votre connexion et réessayez.
    </p>`;
  }
}

function render(){
  screen().classList.remove("thanks-screen");
  screen().style.maxWidth = "";
  screen().innerHTML="";
  void screen().offsetWidth;
  screen().style.animation="none";
  setTimeout(()=>{ screen().style.animation=""; },10);
  const fn = RENDERERS[STEPS[step]];
  if(fn) fn();
  updateChrome();
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&step>0&&step<STEPS.length-1) prev();
});
$("back-btn").onclick = prev;

render();
